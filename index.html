<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haruna — Geometri Kehendak Semesta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- KaTeX untuk rumus matematika (defer agar tidak menahan render halaman) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg: #121212;
      --bg2: #1e1e1e;
      --bg3: #2a2a2a;
      --gold: #d4af37;
      --gold2: #f1d570;
      --gold-dim: rgba(212, 175, 55, 0.15);
      --text: #e0e0e0;
      --text2: #aaaaaa;
      --muted: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 20px 60px; }

    .topnav {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      padding: 16px 0 12px; border-bottom: 1px solid var(--gold-dim); margin-bottom: 0;
    }

    .tn-logo { display: flex; align-items: center; gap: 10px; }
    .tn-logo-icon {
      width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #000000, var(--bg3));
      border: 2px solid var(--gold);
      display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 10px var(--gold-dim);
    }
    .tn-logo-text { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: var(--gold); line-height: 1.1; }
    .tn-logo-sub { font-size: 10px; font-weight: 600; color: var(--text2); letter-spacing: .08em; text-transform: uppercase; }

    .tn-actions { display: flex; gap: 10px; }
    .btn-clear {
      background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold-dim); color: var(--gold2);
      padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-clear:hover { background: rgba(212, 175, 55, 0.2); border-color: var(--gold); }
    .btn-clear:disabled { opacity: .5; cursor: not-allowed; }

    .hero {
      background: linear-gradient(135deg, var(--bg2) 0%, #000000 100%);
      border: 1px solid var(--gold-dim);
      border-radius: 12px; padding: 36px 34px; margin: 22px 0; position: relative; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .hero-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold2);
      margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }
    .hero-title {
      font-family: 'Cinzel', serif; font-size: clamp(24px,4.6vw,32px); color: var(--gold); line-height: 1.2; margin-bottom: 10px;
    }

    .setup-warning {
      display: none; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); border-radius: 8px; padding: 16px; margin-bottom: 20px; font-size: 12px; color: var(--gold2); font-weight: 600;
    }

    .chat-card {
      background: var(--bg2); border: 1px solid var(--gold-dim); border-radius: 12px; box-shadow: 0 6px 30px rgba(0,0,0,.3); margin-bottom: 20px; overflow: hidden;
    }
    .chat-window {
      padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 400px; max-height: 550px; overflow-y: auto;
    }
    .msg { display: flex; gap: 10px; max-width: 90%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; border: 1px solid var(--gold-dim);
    }
    .msg.bot .msg-avatar { background: #000; box-shadow: 0 0 8px var(--gold-dim); }
    .msg.user .msg-avatar { background: var(--bg3); }
    .msg-bubble {
      padding: 12px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.6; word-wrap: break-word; min-width: 0;
    }
    .msg.bot .msg-bubble { background: var(--bg3); color: var(--text); border: 1px solid rgba(255,255,255,0.05); border-top-left-radius: 2px; }
    .msg.user .msg-bubble { background: var(--gold-dim); color: var(--gold2); border: 1px solid var(--gold); border-top-right-radius: 2px; white-space: pre-wrap; }

    .msg-bubble code { background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; }
    .msg-bubble pre { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; border: 1px solid var(--gold-dim); }
    .msg-bubble pre code { background: none; padding: 0; }

    .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 3px 2px; }
    .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: typingBounce 1.2s infinite ease-in-out; }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes typingBounce { 0%,60%,100% { transform: translateY(0); opacity: .3; } 30% { transform: translateY(-4px); opacity: 1; } }

    .chat-input-row { display: flex; align-items: flex-end; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--gold-dim); background: var(--bg2); }
    .chat-input {
      flex: 1; min-width: 0; min-height: 46px; padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); font-family: 'Nunito', sans-serif; font-size: 13px; line-height: 1.5; color: var(--text); background: var(--bg); outline: none; resize: vertical; overflow-wrap: anywhere; transition: border-color .2s;
    }
    .chat-input:focus { border-color: var(--gold); }
    .chat-input::placeholder { color: var(--muted); }
    .chat-send {
      width: 46px; height: 46px; border-radius: 8px; flex-shrink: 0; border: none; cursor: pointer; background: var(--gold); color: #000; font-size: 17px; display: flex; align-items: center; justify-content: center; transition: all .2s; font-weight: bold;
    }
    .chat-send:hover { background: var(--gold2); transform: scale(1.05); }
    .chat-send:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .footer-note {
      font-size: 11px; color: var(--muted); text-align: center; line-height: 1.8; margin-top: 20px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="topnav">
      <div class="tn-logo">
        <div class="tn-logo-icon">H</div>
        <div>
          <div class="tn-logo-text">Haroun</div>
          <div class="tn-logo-sub">Geometri Kehendak Semesta</div>
        </div>
      </div>
      <div class="tn-actions">
        <button class="btn-clear" onclick="clearChatHistory()" style="display: none;">Hapus Memori Sesi</button>
        <button class="btn-clear" id="btn-download" onclick="downloadChatSession()">Unduh &amp; Simpan Sesi</button>
      </div>
    </nav>

    <section class="hero" id="hero">
      <div class="hero-eyebrow">Akses Eksklusif</div>
      <div class="hero-title"> Dan Allah menjadikan bumi untukmu sebagai hamparan, supaya kamu menjalani jalan-jalan yang luas di bumi itu.</div>
    </section>

    <div class="setup-warning" id="setup-warning">
      ⚠️ <strong>Sistem Terinterupsi.</strong> Pastikan URL Web App Google Apps Script sudah dimasukkan di pengaturan CONFIG.
    </div>

    <div class="chat-card">
      <div class="chat-window" id="chat-window"></div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chat-input" rows="3" placeholder="Berikan perintah atau pertanyaan Anda di sini..." aria-label="Pertanyaan atau pesan Anda"></textarea>
        <button class="chat-send" id="chat-send" onclick="handleSend()" aria-label="Kirim">➤</button>
      </div>
    </div>

    <div class="footer-note">
      Sistem Haroun V.1.2.0 <span id="model-info"></span>
    </div>
  </div>

  <script>
    const CONFIG = {
      // URL Web App Google Apps Script
      APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwn1s0ejoaDbhXhS6VGtIyi-DZw_j2kotVBV5f4EwqL1DAFbAfpaZwn8OTkT9T8ISuj/exec',
      // Opsional: samakan dengan Script Property 'APP_TOKEN' di Apps Script (kosongkan jika tidak dipakai)
      APP_TOKEN: '',
      MAX_HISTORY_SENT: 12,      // jumlah pesan terakhir yang dikirim ke server
      MAX_HISTORY_STORED: 100,   // batas riwayat di localStorage
      MAX_RENDERED_ON_LOAD: 30,  // jumlah pesan yang ditampilkan saat halaman dibuka
      TYPE_CHUNK: 6,             // karakter per langkah efek mengetik
      TYPE_SPEED: 30,            // ms per langkah
      TYPE_MAX_LEN: 1500,        // jawaban lebih panjang dari ini tampil instan
      REQUEST_TIMEOUT: 120000    // ms (backend dapat mencoba beberapa model cadangan)
    };

    // Instruksi identitas Haroun ditetapkan di server.

    let history = [];
    try { history = JSON.parse(localStorage.getItem('haroun_chat_history') || '[]'); } catch (e) { history = []; }
    let sending = false;

    function saveHistoryToStorage() {
      try {
        if (history.length > CONFIG.MAX_HISTORY_STORED) history = history.slice(-CONFIG.MAX_HISTORY_STORED);
        localStorage.setItem('haroun_chat_history', JSON.stringify(history));
      } catch (e) { /* penyimpanan penuh/diblokir: abaikan */ }
    }

    async function postToServer(payload) {
      if (CONFIG.APP_TOKEN) payload.token = CONFIG.APP_TOKEN;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), CONFIG.REQUEST_TIMEOUT);
      try {
        const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: ctrl.signal
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    async function downloadChatSession() {
      if (history.length === 0) {
        alert("Belum ada riwayat percakapan untuk diunduh.");
        return;
      }

      const btn = document.getElementById('btn-download');
      let exportText = "=== DOKUMENTASI SESI PERCAKAPAN HARUNA ===\n";
      exportText += "Tanggal: " + new Date().toLocaleString("id-ID") + "\n\n";

      history.forEach((item) => {
        const sender = item.role === 'user' ? 'heondam' : 'Haruna';
        const content = item.parts && item.parts[0] ? item.parts[0].text : '';
        exportText += `[${sender}]:\n${content}\n\n----------------------------------------\n\n`;
      });

      // 1. Unduh .txt ke perangkat
      const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `Sesi_Haroun_${new Date().toISOString().slice(0, 10)}.txt`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      // 2. Simpan ke Memori Drive lewat jalur khusus (tanpa memanggil Gemini)
      btn.disabled = true;
      try {
        const data = await postToServer({ action: 'saveSession', text: exportText });
        if (data && data.error) throw new Error(data.error);
        if (data && data.duplicate) {
          alert("File berhasil terunduh. Sesi yang sama persis sudah pernah diarsipkan sebelumnya.");
        } else if (data && data.warning) {
          alert("File terunduh dan sesi diarsipkan ke Drive, namun: " + data.warning + ".");
        } else {
          alert("Sesi diunduh, diarsipkan ke Drive, dan ringkasannya tersimpan ke Memori Haruna.");
        }
      } catch (err) {
        alert("File berhasil terunduh, namun gagal tersimpan ke Drive karena kendala koneksi.");
      } finally {
        btn.disabled = false;
      }
    }

    function clearChatHistory() {
      if (confirm("Apakah Anda yakin ingin membersihkan riwayat percakapan sesi ini?")) {
        history = [];
        localStorage.removeItem('haroun_chat_history');
        document.getElementById('chat-window').innerHTML = '';
        greet();
      }
    }

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderBotText(str = '') {
      let s = escapeHtml(str);
      s = s.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
      s = s.replace(/\n/g, '<br>');
      return s;
    }

    // Efek mengetik cepat: beberapa karakter per langkah, tag HTML tidak dipotong
    function typeWriterHTML(element, html, chunk, speed) {
      return new Promise((resolve) => {
        const win = document.getElementById('chat-window');
        let i = 0;
        (function step() {
          if (i >= html.length) return resolve();
          let next = Math.min(i + chunk, html.length);
          const lt = html.lastIndexOf('<', next - 1);
          const gt = html.lastIndexOf('>', next - 1);
          if (lt > gt) {                       // berhenti di tengah tag -> lanjutkan sampai tag selesai
            const close = html.indexOf('>', lt);
            next = close === -1 ? html.length : close + 1;
          }
          i = next;
          element.innerHTML = html.slice(0, i);
          win.scrollTop = win.scrollHeight;
          setTimeout(step, speed);
        })();
      });
    }

    function renderLaTeX(element) {
      if (window.renderMathInElement) {
        renderMathInElement(element, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }
    }

    async function appendMessage(role, text, animate = false) {
      const win = document.getElementById('chat-window');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = `
        <div class="msg-avatar">${role === 'user' ? '👑' : 'H'}</div>
        <div class="msg-bubble"></div>
      `;
      win.appendChild(div);
      win.scrollTop = win.scrollHeight;

      const bubble = div.querySelector('.msg-bubble');
      if (role === 'user') {
        bubble.innerHTML = escapeHtml(text);
        renderLaTeX(bubble);
      } else {
        const html = renderBotText(text);
        if (animate && text.length <= CONFIG.TYPE_MAX_LEN) {
          await typeWriterHTML(bubble, html, CONFIG.TYPE_CHUNK, CONFIG.TYPE_SPEED);
        } else {
          bubble.innerHTML = html;
        }
        renderLaTeX(bubble);
        win.scrollTop = win.scrollHeight;
      }
    }

    function showTyping() {
      const win = document.getElementById('chat-window');
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.id = 'typing-row';
      div.innerHTML = '<div class="msg-avatar">H</div><div class="msg-bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>';
      win.appendChild(div);
      win.scrollTop = win.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing-row');
      if (el) el.remove();
    }

    // Ambil N pesan terakhir; urutan harus diawali 'user'
    function recentHistory() {
      const recent = history.slice(-CONFIG.MAX_HISTORY_SENT);
      while (recent.length && recent[0].role !== 'user') recent.shift();
      return recent;
    }

    async function sendToGemini(userText) {
      return postToServer({
        contents: recentHistory().concat([{ role: 'user', parts: [{ text: userText }] }])
      });
    }

    async function handleSend() {
      if (sending) return;
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.includes('GANTI_DENGAN')) {
        document.getElementById('setup-warning').style.display = 'block';
        return;
      }

      sending = true;
      const sendBtn = document.getElementById('chat-send');
      sendBtn.disabled = true;
      input.value = '';

      await appendMessage('user', text);
      showTyping();
      input.blur();

      let reply = null;
      let errorMsg = null;

      try {
        const data = await sendToGemini(text);
        if (data && data.error) {
          errorMsg = '⚠️ Maaf, terjadi galat: ' + data.error;
        } else {
          reply = (data && data.reply) || 'Maaf, Haruna belum bisa memproses perintah tersebut.';
          if (data && data.model) document.getElementById('model-info').textContent = '· model: ' + data.model;
        }
      } catch (err) {
        errorMsg = err && err.name === 'AbortError'
          ? '⚠️ Waktu tunggu habis. Silakan coba lagi.'
          : '⚠️ Sistem penghubung sedang terputus (' + ((err && err.message) || 'tanpa keterangan') + ').';
      }

      hideTyping();

      if (reply !== null) {
        // Simpan riwayat & buka kembali tombol kirim SEBELUM animasi, agar tidak menunggu efek mengetik
        history.push({ role: 'user', parts: [{ text }] });
        history.push({ role: 'model', parts: [{ text: reply }] });
        saveHistoryToStorage();
        sending = false;
        sendBtn.disabled = false;
        await appendMessage('bot', reply, true);
      } else {
        sending = false;
        sendBtn.disabled = false;
        await appendMessage('bot', errorMsg, false);
      }
    }

    document.getElementById('chat-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        handleSend();
      }
    });

    function loadSavedMessages() {
      const win = document.getElementById('chat-window');
      win.innerHTML = '';

      if (history.length === 0) {
        greet();
      } else {
        history.slice(-CONFIG.MAX_RENDERED_ON_LOAD).forEach(item => {
          const role = item.role === 'user' ? 'user' : 'bot';
          const text = item.parts && item.parts[0] ? item.parts[0].text : '';
          appendMessage(role, text, false);
        });
      }
    }

    function greet() {
      appendMessage('bot', "Salamun'alayikum, Heondam. ada yang ingin dipelajari sebelum kita beraksi hari ini?", true);
    }

    if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.includes('GANTI_DENGAN')) {
      document.getElementById('setup-warning').style.display = 'block';
    }

    // Tunggu KaTeX (defer) siap sebelum merender riwayat agar rumus langsung tampil benar
    window.addEventListener('load', loadSavedMessages);
  </script>
</body>
</html>
